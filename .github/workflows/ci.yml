name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: talentflow_test
          POSTGRES_DB: talentflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentflow -d talentflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://talentflow:talentflow_test@localhost:5432/talentflow_test
        run: npm test

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: client
        run: npm run build
